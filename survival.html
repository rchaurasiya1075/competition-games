<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Survival Arena</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;touch-action:none}h1{margin:6px 0;background:linear-gradient(90deg,#ffaa00,#ffff00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:22px}#info{display:flex;gap:10px;margin:4px;font-size:13px}canvas{border:3px solid #444;border-radius:10px;box-shadow:0 0 20px #ffaa00;background:#111;max-width:100%}button{padding:7px 14px;margin:4px;background:#ffaa00;color:#000;border:none;border-radius:16px;font-weight:bold;cursor:pointer}</style></head>
<body><h1>🛡️ Survival Arena 🛡️</h1><div id="info"><div>Score: <span id="sc">0</span></div><div id="t">Survive!</div></div>
<canvas id="g" width="700" height="420"></canvas>
<div><button onclick="init()">Restart</button><button id="rec" onclick="tog()">🔴 Record</button></div>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');let W=700,H=420,p,enemies=[],score=0,o=false,lt=Date.now(),rec=false,mr,ch=[];
function init(){p={x:W/2,y:H/2,vx:0,vy:0,r:18};enemies=[];score=0;o=false;lt=Date.now();spawnE()}
function spawnE(){if(!o&&enemies.length<8)enemies.push({x:Math.random()<0.5?20:W-20,y:40+Math.random()*(H-80),vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,r:12+Math.random()*8});if(!o)setTimeout(spawnE,800)}
function up(){if(o)return;const n=Date.now();if(n-lt>1000){score++;lt=n;document.getElementById('sc').textContent=score}
  if(keys['a'])p.vx-=0.5;if(keys['d'])p.vx+=0.5;if(keys['w'])p.vy-=0.5;if(keys['s'])p.vy+=0.5;
  p.vx*=0.92;p.vy*=0.92;p.x+=p.vx;p.y+=p.vy;p.x=Math.max(p.r,Math.min(W-p.r,p.x));p.y=Math.max(p.r,Math.min(H-p.r,p.y));
  enemies.forEach(e=>{e.x+=e.vx;e.y+=e.vy;if(e.x<20||e.x>W-20)e.vx*=-1;if(e.y<20||e.y>H-20)e.vy*=-1;if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r)o=true});
}
function dr(){ctx.fillStyle='rgba(5,5,16,0.3)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#55ff55';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();enemies.forEach(e=>{ctx.fillStyle='#ff3333';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill()});if(o){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='30px Arial';ctx.textAlign='center';ctx.fillText('Game Over! Score: '+score,W/2,H/2)}}
function lp(){up();dr();requestAnimationFrame(lp)}
const keys={};document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
async function tog(){const b=document.getElementById('rec');if(!rec){try{mr=new MediaRecorder(cv.captureStream(30),{mimeType:'video/webm'});ch=[];mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};mr.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));a.download='survival.webm';a.click()};mr.start();rec=true;b.textContent='⏹️'}catch(e){alert('Chrome')}}else{mr.stop();rec=false;b.textContent='🔴 Record'}}
init();lp();
</script></body></html>
