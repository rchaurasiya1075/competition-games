<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Missile Mayhem</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;touch-action:none}h1{margin:6px 0;background:linear-gradient(90deg,#ff3333,#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:22px}#info{display:flex;gap:10px;margin:4px;font-size:13px}canvas{border:3px solid #444;border-radius:10px;box-shadow:0 0 20px #ff3333;background:#111;max-width:100%}button{padding:7px 14px;margin:4px;background:#ff3333;color:#fff;border:none;border-radius:16px;font-weight:bold;cursor:pointer}</style></head>
<body><h1>🚀 Missile Mayhem 🚀</h1><div id="info"><div>YOU: <span id="sy">0</span></div><div>AI: <span id="sa">0</span></div><div id="t">35s</div></div>
<canvas id="g" width="700" height="420"></canvas>
<div><button onclick="init()">Restart</button><button id="rec" onclick="tog()">🔴 Record</button></div>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');let W=700,H=420,y,a,t=35,o=false,lt=Date.now(),r=false,mr,ch=[];
function m(x,y,c,p){return{x,y,vx:0,vy:0,ang:0,sc:0,c,p,r:16}}
function init(){y=m(160,H/2,'#ff3333',true);a=m(540,H/2,'#00aaff',false);t=35;o=false;lt=Date.now()}
function up(){if(o)return;const n=Date.now();if(n-lt>1000){t--;lt=n;document.getElementById('t').textContent=t+'s';if(t<=0)o=true}
  if(keys['ArrowLeft'])y.ang-=0.08;if(keys['ArrowRight'])y.ang+=0.08;if(keys['ArrowUp']){y.vx+=Math.cos(y.ang)*0.4;y.vy+=Math.sin(y.ang)*0.4}
  a.ang=Math.atan2(y.y-a.y,y.x-a.x)+(Math.random()-0.5)*0.4;a.vx+=Math.cos(a.ang)*0.3;a.vy+=Math.sin(a.ang)*0.3;
  [y,a].forEach(b=>{b.vx*=0.96;b.vy*=0.96;b.x+=b.vx;b.y+=b.vy;if(b.x<20||b.x>W-20)b.vx*=-0.8;if(b.y<20||b.y>H-20)b.vy*=-0.8;b.x=Math.max(20,Math.min(W-20,b.x));b.y=Math.max(20,Math.min(H-20,b.y))});
  const d=Math.hypot(y.x-a.x,y.y-a.y);if(d<40){y.sc+=5;a.sc+=5;y.vx*=-0.7;a.vx*=-0.7;y.vy*=-0.7;a.vy*=-0.7}
  document.getElementById('sy').textContent=y.sc;document.getElementById('sa').textContent=a.sc;
}
function dr(){ctx.fillStyle='rgba(5,5,16,0.3)';ctx.fillRect(0,0,W,H);[y,a].forEach(b=>{ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.ang);ctx.fillStyle=b.c;ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-12,-8);ctx.lineTo(-12,8);ctx.fill();ctx.restore();ctx.fillStyle='#fff';ctx.font='11px Arial';ctx.textAlign='center';ctx.fillText(b.p?'YOU':'AI',b.x,b.y-24)})}
function lp(){up();dr();requestAnimationFrame(lp)}
const keys={};document.addEventListener('keydown',e=>keys[e.key]=true);document.addEventListener('keyup',e=>keys[e.key]=false);
async function tog(){const b=document.getElementById('rec');if(!r){try{mr=new MediaRecorder(cv.captureStream(30),{mimeType:'video/webm'});ch=[];mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};mr.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));a.download='missile.webm';a.click()};mr.start();r=true;b.textContent='⏹️'}catch(e){alert('Chrome')}}else{mr.stop();r=false;b.textContent='🔴 Record'}}
init();lp();
</script></body></html>
