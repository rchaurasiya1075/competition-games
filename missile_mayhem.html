<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Missile Mayhem</title>
<style>
body{margin:0;background:#050510;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center}
h1{margin:8px;background:linear-gradient(90deg,#ff0044,#ff8800);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
canvas{border:3px solid #222;border-radius:8px;box-shadow:0 0 25px #ff0044;background:#0a0a1a;max-width:100%}
#info{display:flex;gap:20px;margin:6px}
button{padding:8px 16px;background:#ff0044;color:#fff;border:none;border-radius:20px}
</style>
</head>
<body>
<h1>🚀 Missile Mayhem</h1>
<div id="info"><span id="s1">YOU: 0</span><span id="s2">AI: 0</span><span id="t">45s</span></div>
<canvas id="c" width="760" height="460"></canvas>
<div style="margin:8px"><button onclick="restart()">Restart</button> Arrow keys to steer</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=cv.width,H=cv.height,p,ai,items=[],flames=[],time=45,over=false,last=Date.now(),keys={};
function m(x,y,col,isP){return{x,y,vx:0,vy:0,a:0,col,isP,score:0,speed:4}}
function init(){p=m(150,230,'#ff0044',true);ai=m(610,230,'#00ccff',false);items=[];flames=[];time=45;over=false;spawn();last=Date.now()}
function spawn(){if(items.length<3&&!over)items.push({x:40+Math.random()*(W-80),y:40+Math.random()*(H-80),v:Math.random()>.4?2:3,l:180});if(!over)setTimeout(spawn,1800)}
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function update(){
  if(over)return;
  if(Date.now()-last>1000){time--;last=Date.now();document.getElementById('t').textContent=time+'s';if(time<=0){over=true;alert(p.score>=ai.score?'YOU WIN':'AI Wins')}}
  if(keys.arrowleft||keys.a)p.a-=.07; if(keys.arrowright||keys.d)p.a+=.07;
  if(keys.arrowup||keys.w)p.speed=Math.min(8,p.speed+.15); else p.speed=Math.max(3,p.speed-.05);
  p.vx=Math.cos(p.a)*p.speed; p.vy=Math.sin(p.a)*p.speed;
  if(items.length){let n=items.reduce((x,y)=>Math.hypot(x.x-ai.x,x.y-ai.y)<Math.hypot(y.x-ai.x,y.y-ai.y)?x:y);ai.a=Math.atan2(n.y-ai.y,n.x-ai.x)}
  ai.vx=Math.cos(ai.a)*4.5; ai.vy=Math.sin(ai.a)*4.5;
  [p,ai].forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<20||b.x>W-20)b.a=Math.PI-b.a;if(b.y<20||b.y>H-20)b.a=-b.a});
  let d=Math.hypot(p.x-ai.x,p.y-ai.y);
  if(d<36){p.score+=8;ai.score+=8;p.a+=Math.PI*.6;ai.a-=Math.PI*.6;for(let i=0;i<8;i++)flames.push({x:(p.x+ai.x)/2,y:(p.y+ai.y)/2,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:12})}
  items=items.filter(it=>{it.l--;[p,ai].forEach(b=>{if(Math.hypot(b.x-it.x,b.y-it.y)<28){b.score+=it.v*18;it.l=0}});return it.l>0});
  flames=flames.filter(f=>{f.x+=f.vx;f.y+=f.vy;f.l--;return f.l>0});
  document.getElementById('s1').textContent='YOU: '+Math.round(p.score);
  document.getElementById('s2').textContent='AI: '+Math.round(ai.score);
}
function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  items.forEach(it=>{ctx.fillStyle='#ff0';ctx.font='bold 16px Arial';ctx.fillText(it.v+'x',it.x,it.y)});
  flames.forEach(f=>{ctx.fillStyle='#f80';ctx.fillRect(f.x,f.y,3,3)});
  [p,ai].forEach(b=>{
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a);
    ctx.fillStyle=b.col;ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-12,8);ctx.lineTo(-12,-8);ctx.fill();
    ctx.restore();
  });
}
function loop(){update();draw();requestAnimationFrame(loop)}
function restart(){init()}
init();loop();
</script>
</body>
</html>
