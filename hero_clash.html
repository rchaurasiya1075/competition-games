<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hero vs Robot</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;touch-action:none}h1{margin:6px 0;background:linear-gradient(90deg,#55ff55,#00aaff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:22px}#info{display:flex;gap:10px;margin:4px;font-size:13px}canvas{border:3px solid #444;border-radius:10px;box-shadow:0 0 20px #55ff55;background:#111;max-width:100%}button{padding:7px 14px;margin:4px;background:#55ff55;color:#000;border:none;border-radius:16px;font-weight:bold;cursor:pointer}</style></head>
<body><h1>🦸 Hero vs Robot 🦸</h1><div id="info"><div>Hero Size: <span id="sh">20</span></div><div>Robot Size: <span id="sr">20</span></div><div id="t">40s</div></div>
<canvas id="g" width="700" height="420"></canvas>
<div><button onclick="init()">Restart</button><button id="rec" onclick="tog()">🔴 Record</button></div>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');let W=700,H=420,h,r,t=40,o=false,lt=Date.now(),rec=false,mr,ch=[];
function ent(x,y,c,p){return{x,y,vx:0,vy:0,sz:20,c,p}}
function init(){h=ent(200,H/2,'#55ff55',true);r=ent(500,H/2,'#ff5555',false);t=40;o=false;lt=Date.now()}
function up(){if(o)return;const n=Date.now();if(n-lt>1000){t--;lt=n;document.getElementById('t').textContent=t+'s';if(t<=0)o=true}
  if(keys['a'])h.vx-=0.4;if(keys['d'])h.vx+=0.4;if(keys['w'])h.vy-=0.4;if(keys['s'])h.vy+=0.4;
  const dx=h.x-r.x,dy=h.y-r.y;r.vx+=(dx>0?-0.3:0.3)+(Math.random()-0.5)*0.5;r.vy+=(dy>0?-0.3:0.3)+(Math.random()-0.5)*0.5;
  [h,r].forEach(b=>{b.vx*=0.92;b.vy*=0.92;b.x+=b.vx;b.y+=b.vy;b.x=Math.max(b.sz,Math.min(W-b.sz,b.x));b.y=Math.max(b.sz,Math.min(H-b.sz,b.y))});
  const d=Math.hypot(h.x-r.x,h.y-r.y);if(d<h.sz+r.sz){if(h.sz>r.sz)h.sz+=1.5;else r.sz+=1.5;h.vx*=-0.8;r.vx*=-0.8;h.vy*=-0.8;r.vy*=-0.8}
  document.getElementById('sh').textContent=Math.round(h.sz);document.getElementById('sr').textContent=Math.round(r.sz);
}
function dr(){ctx.fillStyle='rgba(5,5,16,0.3)';ctx.fillRect(0,0,W,H);[h,r].forEach(b=>{ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.sz,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='11px Arial';ctx.textAlign='center';ctx.fillText(b.p?'HERO':'ROBOT',b.x,b.y+4)})}
function lp(){up();dr();requestAnimationFrame(lp)}
const keys={};document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
async function tog(){const b=document.getElementById('rec');if(!rec){try{mr=new MediaRecorder(cv.captureStream(30),{mimeType:'video/webm'});ch=[];mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};mr.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));a.download='hero.webm';a.click()};mr.start();rec=true;b.textContent='⏹️'}catch(e){alert('Chrome')}}else{mr.stop();rec=false;b.textContent='🔴 Record'}}
init();lp();
</script></body></html>
