<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Auto Ball Arena — Fully Automated</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  h1 {
    margin: 8px 0;
    background: linear-gradient(90deg, #ff00ff, #00ffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 24px;
  }
  #info {
    display: flex;
    gap: 16px;
    margin: 6px;
    font-size: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #levelInfo { color: #ffff00; font-weight: bold; }
  canvas {
    border: 3px solid #444;
    border-radius: 12px;
    box-shadow: 0 0 30px #ff00ff;
    background: radial-gradient(circle, #1a1a2e, #050510);
    max-width: 100%;
    touch-action: none;
  }
  .controls {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  button {
    padding: 8px 16px;
    font-size: 14px;
    background: linear-gradient(45deg, #ff00ff, #00ffff);
    border: none;
    border-radius: 18px;
    color: #000;
    font-weight: bold;
    cursor: pointer;
  }
  #recordBtn { background: #ff3333; color: #fff; }
  #musicBtn { background: #33aa55; color: #fff; }
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  #overlay h2 { font-size: 32px; margin-bottom: 12px; }
  select { padding: 6px 10px; border-radius: 10px; background: #222; color: #fff; border: 1px solid #555; }
</style>
</head>
<body>
<h1>⚡ Auto Ball Arena ⚡</h1>
<div id="info">
  <div id="levelInfo">Level 1/10 | Target: 100</div>
  <div id="s1"></div>
  <div id="s2"></div>
  <div id="timer">Time: 50s</div>
</div>
<canvas id="game" width="700" height="420"></canvas>
<div class="controls">
  <button onclick="restart()">Restart</button>
  <button id="recordBtn" onclick="toggleRecord()">🔴 Record</button>
  <button id="musicBtn" onclick="toggleMusic()">🎵 Music: OFF</button>
  <select id="sizeSelect" onchange="resizeCanvas()">
    <option value="500x300">Small</option>
    <option value="700x420" selected>Medium</option>
    <option value="900x540">Large</option>
    <option value="1200x700">XL</option>
  </select>
</div>

<div id="overlay">
  <h2 id="ot"></h2>
  <p id="om"></p>
  <button onclick="nextLevel()">Next Level</button>
  <button onclick="restart()">Retry</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width, H = canvas.height;

let ball1, ball2, particles = [], multipliers = [];
let timeLeft = 50;
let gameOver = false;
let lastTime = Date.now();
let level = 1;
const MAX_LEVEL = 10;
let targetScore = 100;
let recording = false;
let mediaRecorder = null;
let recordedChunks = [];
let musicOn = false;
let audioCtx = null;
let musicInterval = null;

function createBall(x, y, color, name) {
  const angle = Math.random() * Math.PI * 2;
  const speed = 3.5 + Math.random() * 1.5;
  return {
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    r: 22,
    color,
    name,
    score: 0,
    target: null
  };
}

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(freq, duration, type = 'sine', vol = 0.12) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + duration);
}

function playBounce() { playSound(140 + Math.random()*40, 0.08, 'sine', 0.08); }
function playPickup() { playSound(520, 0.12); playSound(780, 0.08); }
function playHit() { playSound(180, 0.1, 'square', 0.1); }
function playLevel() { playSound(440, 0.18); playSound(660, 0.18); playSound(880, 0.25); }

function startMusic() {
  if (musicInterval) clearInterval(musicInterval);
  const notes = [261, 329, 392, 523, 392, 329];
  let i = 0;
  musicInterval = setInterval(() => {
    if (musicOn && audioCtx) playSound(notes[i % notes.length], 0.22, 'triangle', 0.055);
    i++;
  }, 400);
}

function toggleMusic() {
  initAudio();
  musicOn = !musicOn;
  document.getElementById('musicBtn').textContent = musicOn ? '🎵 Music: ON' : '🎵 Music: OFF';
  if (musicOn) startMusic();
  else if (musicInterval) clearInterval(musicInterval);
}

function init() {
  const scale = Math.min(W / 700, H / 420);
  ball1 = createBall(W * 0.3, H / 2, '#ff00ff', 'Pink');
  ball2 = createBall(W * 0.7, H / 2, '#00ffff', 'Cyan');
  ball1.r = 22 * scale;
  ball2.r = 22 * scale;
  particles = [];
  multipliers = [];
  timeLeft = Math.max(25, 55 - level * 3);
  gameOver = false;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('levelInfo').textContent = `Level ${level}/${MAX_LEVEL} | Target: ${targetScore}`;
  document.getElementById('timer').textContent = 'Time: ' + timeLeft + 's';
  updateScores();
  spawnMultiplier();
  lastTime = Date.now();
  initAudio();
}

function updateScores() {
  document.getElementById('s1').innerHTML = `<span style="color:${ball1.color}">${ball1.name}: ${Math.round(ball1.score)}</span>`;
  document.getElementById('s2').innerHTML = `<span style="color:${ball2.color}">${ball2.name}: ${Math.round(ball2.score)}</span>`;
}

function spawnMultiplier() {
  if (multipliers.length < 3 && !gameOver) {
    multipliers.push({
      x: 60 + Math.random() * (W - 120),
      y: 60 + Math.random() * (H - 120),
      value: Math.random() > 0.5 ? 2 : 3,
      life: 350 + Math.random() * 100
    });
  }
  if (!gameOver) setTimeout(spawnMultiplier, 2200 + Math.random() * 1500);
}

function bounceWall(b) {
  let bounced = false;
  if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.92; bounced = true; }
  if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.92; bounced = true; }
  if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.92; bounced = true; }
  if (b.y + b.r > H) { b.y = H - b.r; b.vy = -Math.abs(b.vy) * 0.92; bounced = true; }
  if (bounced) {
    playBounce();
    b.target = null;
  }
}

function seekTarget(ball) {
  if (multipliers.length === 0) return;

  let nearest = multipliers[0];
  let nd = Math.hypot(nearest.x - ball.x, nearest.y - ball.y);
  for (let m of multipliers) {
    const d = Math.hypot(m.x - ball.x, m.y - ball.y);
    if (d < nd) { nearest = m; nd = d; }
  }

  const desiredAng = Math.atan2(nearest.y - ball.y, nearest.x - ball.x);
  const currentAng = Math.atan2(ball.vy, ball.vx);
  let diff = desiredAng - currentAng;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;

  if (Math.abs(diff) > 0.4) {
    const turn = Math.sign(diff) * 0.06;
    const speed = Math.hypot(ball.vx, ball.vy);
    const newAng = currentAng + turn;
    ball.vx = Math.cos(newAng) * speed;
    ball.vy = Math.sin(newAng) * speed;
  }
}

function update() {
  if (gameOver) return;

  const now = Date.now();
  if (now - lastTime > 1000) {
    timeLeft--;
    lastTime = now;
    document.getElementById('timer').textContent = 'Time: ' + timeLeft + 's';
    if (timeLeft <= 0) checkEnd();
  }

  seekTarget(ball1);
  seekTarget(ball2);

  [ball1, ball2].forEach(b => {
    b.x += b.vx;
    b.y += b.vy;
    bounceWall(b);
  });

  const dx = ball2.x - ball1.x, dy = ball2.y - ball1.y;
  const dist = Math.hypot(dx, dy);
  if (dist < ball1.r + ball2.r && dist > 0) {
    const overlap = (ball1.r + ball2.r - dist) * 0.5;
    const nx = dx / dist, ny = dy / dist;
    ball1.x -= nx * overlap;
    ball2.x += nx * overlap;

    const relVx = ball1.vx - ball2.vx;
    const relVy = ball1.vy - ball2.vy;
    const sep = relVx * nx + relVy * ny;
    if (sep < 0) {
      const impulse = sep * 0.8;
      ball1.vx -= impulse * nx;
      ball1.vy -= impulse * ny;
      ball2.vx += impulse * nx;
      ball2.vy += impulse * ny;
    }

    ball1.score += 6 + level;
    ball2.score += 6 + level;
    playHit();

    for (let i = 0; i < 8; i++) {
      particles.push({
        x: (ball1.x + ball2.x) / 2,
        y: (ball1.y + ball2.y) / 2,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        life: 20,
        color: Math.random() > 0.5 ? ball1.color : ball2.color
      });
    }
  }

  multipliers = multipliers.filter(m => {
    m.life--;
    [ball1, ball2].forEach(ball => {
      if (Math.hypot(ball.x - m.x, ball.y - m.y) < ball.r + 16) {
        ball.score += m.value * (18 + level * 2);
        m.life = 0;
        playPickup();
        for (let i = 0; i < 12; i++) {
          particles.push({
            x: m.x, y: m.y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 24,
            color: '#ffff00'
          });
        }
      }
    });
    return m.life > 0;
  });

  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    p.vx *= 0.95;
    p.vy *= 0.95;
    return p.life > 0;
  });

  updateScores();
  if (ball1.score >= targetScore || ball2.score >= targetScore) completeLevel();
}

function completeLevel() {
  gameOver = true;
  playLevel();
  const winner = ball1.score >= ball2.score ? ball1 : ball2;
  if (level >= MAX_LEVEL) {
    document.getElementById('ot').textContent = 'FULL CLEAR! 🏆';
    document.getElementById('om').textContent = `${winner.name} dominated all levels!`;
  } else {
    document.getElementById('ot').textContent = `Level ${level} Complete! 🎉`;
    document.getElementById('om').textContent = `${winner.name}: ${Math.round(winner.score)} pts`;
  }
  document.getElementById('overlay').style.display = 'flex';
}

function checkEnd() {
  if (ball1.score >= targetScore || ball2.score >= targetScore) {
    completeLevel();
  } else {
    gameOver = true;
    document.getElementById('ot').textContent = 'Time Up!';
    document.getElementById('om').textContent = `Pink: ${Math.round(ball1.score)} | Cyan: ${Math.round(ball2.score)}`;
    document.getElementById('overlay').style.display = 'flex';
  }
}

function nextLevel() {
  if (level < MAX_LEVEL) {
    level++;
    targetScore = Math.round(targetScore * 1.5 + 30);
    init();
  }
}

function restart() {
  init();
}

function draw() {
  if (!ball1) return;
  ctx.fillStyle = 'rgba(5,5,16,0.3)';
  ctx.fillRect(0, 0, W, H);

  multipliers.forEach(m => {
    ctx.save();
    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = '#ffff00';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ffff00';
    ctx.textAlign = 'center';
    ctx.fillText(m.value + 'x', m.x, m.y + 6);
    ctx.restore();
  });

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life / 20);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  [ball1, ball2].forEach(b => {
    ctx.save();
    ctx.shadowBlur = 25;
    ctx.shadowColor = b.color;
    const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, b.color);
    grad.addColorStop(1, b.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(b.name, b.x, b.y + 4);
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function resizeCanvas() {
  const val = document.getElementById('sizeSelect').value;
  const [w, h] = val.split('x').map(Number);
  canvas.width = w;
  canvas.height = h;
  W = w; H = h;
  if (ball1) init();
}

async function toggleRecord() {
  const btn = document.getElementById('recordBtn');
  if (!recording) {
    try {
      const stream = canvas.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      recordedChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `auto_ball_L${level}.webm`;
        a.click();
        URL.revokeObjectURL(url);
      };
      mediaRecorder.start();
      recording = true;
      btn.textContent = '⏹️ Stop & Save';
      btn.style.background = '#ffaa00';
    } catch (err) {
      alert('Recording works best in Chrome on Android.');
    }
  } else {
    mediaRecorder.stop();
    recording = false;
    btn.textContent = '🔴 Record';
    btn.style.background = '#ff3333';
  }
}

init();
loop();
</script>
</body>
</html>
