<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Ball Battle - Levels + Recording</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  h1 {
    margin: 6px 0;
    background: linear-gradient(90deg, #ff00ff, #00ffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 22px;
  }
  #info {
    display: flex;
    gap: 12px;
    margin: 4px;
    font-size: 14px;
    flex-wrap: wrap;
    justify-content: center;
    text-align: center;
  }
  .you { color: #ff55ff; }
  .ai { color: #55ffff; }
  #levelInfo { color: #ffff00; font-weight: bold; }
  canvas {
    border: 3px solid #444;
    border-radius: 10px;
    box-shadow: 0 0 20px #ff00ff;
    background: radial-gradient(circle, #1a1a2e, #0a0a12);
    max-width: 100%;
    touch-action: none;
  }
  .controls {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  button {
    padding: 8px 16px;
    font-size: 14px;
    background: linear-gradient(45deg, #ff00ff, #00ffff);
    border: none;
    border-radius: 18px;
    color: #000;
    font-weight: bold;
    cursor: pointer;
  }
  #recordBtn { background: #ff3333; color: #fff; }
  #winScreen, #levelScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  #winScreen h2, #levelScreen h2 { font-size: 32px; margin-bottom: 15px; }
  select { padding: 6px 10px; border-radius: 10px; background: #222; color: #fff; border: 1px solid #555; }
</style>
</head>
<body>
<h1>⚡ Neon Ball Battle ⚡</h1>
<div id="info">
  <div id="levelInfo">Level 1 | Target: 80 pts</div>
  <div class="you">YOU: <span id="scoreYou">0</span></div>
  <div class="ai">AI: <span id="scoreAi">0</span></div>
  <div id="timer">Time: 45s</div>
</div>
<canvas id="game" width="700" height="420"></canvas>
<div class="controls">
  <button onclick="restartLevel()">Restart Level</button>
  <button id="recordBtn" onclick="toggleRecord()">🔴 Record</button>
  <select id="sizeSelect" onchange="resizeCanvas()">
    <option value="500x300">Small (500x300)</option>
    <option value="700x420" selected>Medium (700x420)</option>
    <option value="900x540">Large (900x540)</option>
    <option value="1200x700">XL (1200x700)</option>
  </select>
  <span style="font-size:12px; opacity:0.8;">Arrows/WASD | Touch boost</span>
</div>

<div id="levelScreen">
  <h2 id="levelText">Level Complete!</h2>
  <p id="levelMsg">Points reached!</p>
  <button onclick="nextLevel()">Next Level</button>
  <button onclick="restartLevel()">Retry</button>
</div>
<div id="winScreen">
  <h2 id="winText">Game Over</h2>
  <button onclick="restartLevel()">Try Again</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width, H = canvas.height;

let player, ai, particles = [], multipliers = [];
let keys = {};
let timeLeft = 45;
let gameOver = false;
let lastTime = Date.now();
let level = 1;
let targetScore = 80;
let recording = false;
let mediaRecorder = null;
let recordedChunks = [];

function createBall(x, y, color, isPlayer) {
  return { x, y, vx: 0, vy: 0, r: 20, color, isPlayer, score: 0 };
}

function initLevel() {
  const scale = Math.min(W / 700, H / 420);
  player = createBall(W*0.25, H/2, '#ff00ff', true);
  ai = createBall(W*0.75, H/2, '#00ffff', false);
  player.r = 20 * scale;
  ai.r = 20 * scale;
  particles = [];
  multipliers = [];
  timeLeft = Math.max(30, 50 - level * 3);
  gameOver = false;
  document.getElementById('levelScreen').style.display = 'none';
  document.getElementById('winScreen').style.display = 'none';
  document.getElementById('levelInfo').textContent = `Level ${level} | Target: ${targetScore} pts`;
  document.getElementById('timer').textContent = 'Time: ' + timeLeft + 's';
  spawnMultiplier();
  lastTime = Date.now();
}

function spawnMultiplier() {
  if (multipliers.length < 3 && !gameOver) {
    multipliers.push({
      x: 40 + Math.random() * (W - 80),
      y: 40 + Math.random() * (H - 80),
      value: Math.random() > 0.4 ? 2 : 3,
      life: 350
    });
  }
  if (!gameOver) setTimeout(spawnMultiplier, 2800 + Math.random() * 1500);
}

document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (gameOver) return;

  const now = Date.now();
  if (now - lastTime > 1000) {
    timeLeft--;
    lastTime = now;
    document.getElementById('timer').textContent = 'Time: ' + timeLeft + 's';
    if (timeLeft <= 0) checkEnd();
  }

  const acc = 0.4;
  if (keys['arrowleft'] || keys['a']) player.vx -= acc;
  if (keys['arrowright'] || keys['d']) player.vx += acc;
  if (keys['arrowup'] || keys['w']) player.vy -= acc;
  if (keys['arrowdown'] || keys['s']) player.vy += acc;

  player.vx *= 0.95;
  player.vy *= 0.95;
  ai.vx *= 0.96;
  ai.vy *= 0.96;

  if (multipliers.length > 0) {
    let nearest = multipliers.reduce((a,b) => Math.hypot(a.x-ai.x,a.y-ai.y) < Math.hypot(b.x-ai.x,b.y-ai.y) ? a : b);
    const ang = Math.atan2(nearest.y - ai.y, nearest.x - ai.x);
    ai.vx += Math.cos(ang) * (0.22 + level*0.02);
    ai.vy += Math.sin(ang) * (0.22 + level*0.02);
  } else if (Math.random() < 0.04) {
    ai.vx += (Math.random() - 0.5) * 2;
    ai.vy += (Math.random() - 0.5) * 2;
  }

  [player, ai].forEach(b => {
    const spd = Math.hypot(b.vx, b.vy);
    if (spd > 8) { b.vx *= 8/spd; b.vy *= 8/spd; }
    b.x += b.vx;
    b.y += b.vy;
    if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.75; }
    if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.75; }
    if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.75; }
    if (b.y + b.r > H) { b.y = H - b.r; b.vy = -Math.abs(b.vy) * 0.75; }
  });

  const dx = ai.x - player.x, dy = ai.y - player.y;
  const dist = Math.hypot(dx, dy);
  if (dist < player.r + ai.r && dist > 0) {
    const overlap = (player.r + ai.r - dist) / 2;
    const nx = dx / dist, ny = dy / dist;
    player.x -= nx * overlap;
    ai.x += nx * overlap;
    const relVx = player.vx - ai.vx, relVy = player.vy - ai.vy;
    const sep = relVx * nx + relVy * ny;
    if (sep < 0) {
      player.vx -= sep * nx * 0.7;
      player.vy -= sep * ny * 0.7;
      ai.vx += sep * nx * 0.7;
      ai.vy += sep * ny * 0.7;
    }
    player.score += 4 + level;
    ai.score += 3 + level;
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: (player.x + ai.x)/2, y: (player.y + ai.y)/2,
        vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7,
        life: 20, color: Math.random()>0.5 ? player.color : ai.color
      });
    }
  }

  multipliers = multipliers.filter(m => {
    m.life--;
    [player, ai].forEach(ball => {
      if (Math.hypot(ball.x - m.x, ball.y - m.y) < ball.r + 16) {
        ball.score += m.value * (12 + level * 2);
        m.life = 0;
        for (let i = 0; i < 12; i++) {
          particles.push({
            x: m.x, y: m.y,
            vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
            life: 25, color: '#ffff00'
          });
        }
      }
    });
    return m.life > 0;
  });

  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.life--;
    p.vx *= 0.94; p.vy *= 0.94;
    return p.life > 0;
  });

  document.getElementById('scoreYou').textContent = Math.round(player.score);
  document.getElementById('scoreAi').textContent = Math.round(ai.score);

  if (player.score >= targetScore) completeLevel();
}

function completeLevel() {
  gameOver = true;
  document.getElementById('levelText').textContent = 'Level ' + level + ' Complete! 🎉';
  document.getElementById('levelMsg').textContent = 'You reached ' + Math.round(player.score) + ' points!';
  document.getElementById('levelScreen').style.display = 'flex';
}

function checkEnd() {
  if (player.score >= targetScore) {
    completeLevel();
  } else {
    gameOver = true;
    document.getElementById('winText').textContent = 'Time Up! You: ' + Math.round(player.score) + ' / ' + targetScore;
    document.getElementById('winScreen').style.display = 'flex';
  }
}

function nextLevel() {
  level++;
  targetScore = Math.round(targetScore * 1.6 + 20);
  initLevel();
}

function restartLevel() {
  initLevel();
}

function draw() {
  ctx.fillStyle = 'rgba(10,10,18,0.35)';
  ctx.fillRect(0, 0, W, H);

  multipliers.forEach(m => {
    ctx.save();
    ctx.font = 'bold 24px Arial';
    ctx.fillStyle = '#ffff00';
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#ffff00';
    ctx.textAlign = 'center';
    ctx.fillText(m.value + 'x', m.x, m.y);
    ctx.restore();
  });

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 20;
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  [player, ai].forEach(b => {
    ctx.save();
    ctx.shadowBlur = 20;
    ctx.shadowColor = b.color;
    const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, b.color);
    grad.addColorStop(1, b.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(b.isPlayer ? 'YOU' : 'AI', b.x, b.y + 3);
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function resizeCanvas() {
  const val = document.getElementById('sizeSelect').value;
  const [w, h] = val.split('x').map(Number);
  canvas.width = w;
  canvas.height = h;
  W = w; H = h;
  initLevel();
}

async function toggleRecord() {
  const btn = document.getElementById('recordBtn');
  if (!recording) {
    try {
      const stream = canvas.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      recordedChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ball_battle_level' + level + '.webm';
        a.click();
        URL.revokeObjectURL(url);
      };
      mediaRecorder.start();
      recording = true;
      btn.textContent = '⏹️ Stop & Save';
      btn.style.background = '#ffaa00';
    } catch (err) {
      alert('Recording not supported on this browser. Try Chrome/Android.');
    }
  } else {
    mediaRecorder.stop();
    recording = false;
    btn.textContent = '🔴 Record';
    btn.style.background = '#ff3333';
  }
}

canvas.addEventListener('pointerdown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  const d = Math.hypot(player.x - mx, player.y - my);
  if (d < 180) {
    const force = 3.5;
    player.vx += (player.x - mx) / d * force;
    player.vy += (player.y - my) / d * force;
  }
});

initLevel();
loop();
</script>
</body>
</html>
