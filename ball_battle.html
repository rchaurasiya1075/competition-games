<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Ball Battle - Auto + Physics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12; color: #fff; font-family: Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    overflow: hidden; touch-action: none;
  }
  h1 {
    margin: 6px 0; background: linear-gradient(90deg, #ff00ff, #00ffff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 22px;
  }
  #setup, #gameArea { width: 100%; display: flex; flex-direction: column; align-items: center; }
  #setup { padding: 12px; }
  .setup-row { margin: 6px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  input, select { padding: 7px 10px; border-radius: 8px; background: #222; color: #fff; border: 1px solid #555; font-size: 13px; }
  #info { display: flex; gap: 8px; margin: 4px; font-size: 13px; flex-wrap: wrap; justify-content: center; }
  #levelInfo { color: #ffff00; font-weight: bold; }
  canvas {
    border: 3px solid #444; border-radius: 10px; box-shadow: 0 0 25px #ff00ff;
    background: radial-gradient(circle, #1a1a2e, #0a0a12); max-width: 100%; touch-action: none;
  }
  .controls { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button {
    padding: 7px 14px; font-size: 13px; background: linear-gradient(45deg, #ff00ff, #00ffff);
    border: none; border-radius: 16px; color: #000; font-weight: bold; cursor: pointer;
  }
  #recordBtn { background: #ff3333; color: #fff; }
  #musicBtn { background: #33aa55; color: #fff; }
  #autoBtn { background: #aa55ff; color: #fff; }
  #winScreen, #levelScreen {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.93);
    flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 20px;
  }
  #winScreen h2, #levelScreen h2 { font-size: 28px; margin-bottom: 10px; }
</style>
</head>
<body>
<h1>⚡ Neon Ball Battle ⚡</h1>
<div id="setup">
  <div class="setup-row">
    <label>Name 1: <input id="name1" value="Pink" maxlength="10"></label>
    <label>Color: <input type="color" id="color1" value="#ff00ff"></label>
  </div>
  <div class="setup-row">
    <label>Name 2: <input id="name2" value="Cyan" maxlength="10"></label>
    <label>Color: <input type="color" id="color2" value="#00ffff"></label>
  </div>
  <div class="setup-row">
    <label><input type="checkbox" id="autoMode" checked> Full Auto (best for recording)</label>
    <button onclick="startGame()">Start</button>
  </div>
</div>
<div id="gameArea" style="display:none;">
  <div id="info">
    <div id="levelInfo">Level 1/10 | Target 80</div>
    <div id="score1Display"></div>
    <div id="score2Display"></div>
    <div id="timer">45s</div>
  </div>
  <canvas id="game" width="700" height="420"></canvas>
  <div class="controls">
    <button onclick="restartLevel()">Restart</button>
    <button id="recordBtn" onclick="toggleRecord()">🔴 Record</button>
    <button id="musicBtn" onclick="toggleMusic()">🎵 Music OFF</button>
    <button id="autoBtn" onclick="toggleAuto()">Auto: ON</button>
    <select id="sizeSelect" onchange="resizeCanvas()">
      <option value="500x300">Small</option>
      <option value="700x420" selected>Medium</option>
      <option value="900x540">Large</option>
      <option value="1200x700">XL</option>
    </select>
  </div>
</div>
<div id="levelScreen">
  <h2 id="levelText">Level Complete!</h2>
  <p id="levelMsg"></p>
  <button onclick="nextLevel()">Next</button>
  <button onclick="restartLevel()">Retry</button>
</div>
<div id="winScreen">
  <h2 id="winText">Game Over</h2>
  <p id="finalMsg"></p>
  <button onclick="location.reload()">New</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width, H = canvas.height;
let player, ai, particles = [], multipliers = [];
let keys = {};
let timeLeft = 45, gameOver = false, lastTime = Date.now();
let level = 1, MAX_LEVEL = 10, targetScore = 80;
let recording = false, mediaRecorder = null, recordedChunks = [];
let musicOn = false, audioCtx = null, musicInterval = null;
let autoMode = true;

function createBall(x, y, color, isPlayer, name) {
  return { x, y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, r: 20, color, isPlayer, name, score: 0 };
}

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(freq, dur, type='sine', vol=0.12) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function playCollision() { playSound(160 + Math.random()*40, 0.1, 'square', 0.1); }
function playPickup() { playSound(500, 0.12); playSound(750, 0.08); }
function playLevelUp() { playSound(440, 0.18); playSound(660, 0.18); playSound(880, 0.25); }
function playWin() { playSound(523, 0.25); playSound(659, 0.25); playSound(784, 0.4); }
function playLose() { playSound(180, 0.35, 'sawtooth', 0.12); }

function startMusic() {
  if (musicInterval) clearInterval(musicInterval);
  const notes = [261.6, 329.6, 392, 523.3, 392, 329.6];
  let i = 0;
  musicInterval = setInterval(() => {
    if (musicOn && audioCtx) playSound(notes[i % notes.length], 0.22, 'triangle', 0.055);
    i++;
  }, 380);
}
function toggleMusic() {
  initAudio(); musicOn = !musicOn;
  document.getElementById('musicBtn').textContent = musicOn ? '🎵 Music ON' : '🎵 Music OFF';
  if (musicOn) startMusic(); else if (musicInterval) clearInterval(musicInterval);
}
function toggleAuto() {
  autoMode = !autoMode;
  document.getElementById('autoBtn').textContent = autoMode ? 'Auto: ON' : 'Auto: OFF';
}

function startGame() {
  const n1 = document.getElementById('name1').value || 'Pink';
  const n2 = document.getElementById('name2').value || 'Cyan';
  const c1 = document.getElementById('color1').value;
  const c2 = document.getElementById('color2').value;
  autoMode = document.getElementById('autoMode').checked;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('gameArea').style.display = 'flex';
  document.getElementById('autoBtn').textContent = autoMode ? 'Auto: ON' : 'Auto: OFF';
  player = createBall(W*0.28, H/2, c1, true, n1);
  ai = createBall(W*0.72, H/2, c2, false, n2);
  initLevel();
  initAudio();
}

function initLevel() {
  const scale = Math.min(W/700, H/420);
  player.x = W*0.28; player.y = H/2; player.vx = (Math.random()-0.5)*5; player.vy = (Math.random()-0.5)*5;
  player.r = 20*scale; player.score = 0;
  ai.x = W*0.72; ai.y = H/2; ai.vx = (Math.random()-0.5)*5; ai.vy = (Math.random()-0.5)*5;
  ai.r = 20*scale; ai.score = 0;
  particles = []; multipliers = [];
  timeLeft = Math.max(22, 46 - level*2);
  gameOver = false;
  document.getElementById('levelScreen').style.display = 'none';
  document.getElementById('winScreen').style.display = 'none';
  document.getElementById('levelInfo').textContent = `Level ${level}/${MAX_LEVEL} | Target ${targetScore}`;
  document.getElementById('timer').textContent = timeLeft + 's';
  updateScore();
  spawnMultiplier();
  lastTime = Date.now();
}

function updateScore() {
  document.getElementById('score1Display').innerHTML = `<span style="color:${player.color}">${player.name}: ${Math.round(player.score)}</span>`;
  document.getElementById('score2Display').innerHTML = `<span style="color:${ai.color}">${ai.name}: ${Math.round(ai.score)}</span>`;
}

function spawnMultiplier() {
  if (multipliers.length < 4 && !gameOver) {
    multipliers.push({
      x: 50 + Math.random()*(W-100),
      y: 50 + Math.random()*(H-100),
      vx: (Math.random()-0.5)*1.2,
      vy: (Math.random()-0.5)*1.2,
      value: Math.random() > 0.5 ? 2 : 3,
      life: 280 + Math.random()*100
    });
  }
  if (!gameOver) setTimeout(spawnMultiplier, 1800 + Math.random()*1000);
}

document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function bounceWall(b) {
  const bounce = 0.82;
  let bounced = false;
  if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx) * bounce; bounced = true; }
  if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * bounce; bounced = true; }
  if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy) * bounce; bounced = true; }
  if (b.y + b.r > H) { b.y = H - b.r; b.vy = -Math.abs(b.vy) * bounce; bounced = true; }
  if (bounced) {
    b.vx += (Math.random()-0.5)*0.8;
    b.vy += (Math.random()-0.5)*0.8;
    playSound(120 + Math.random()*60, 0.06, 'sine', 0.05);
  }
}

function aiThink(ball, other) {
  if (multipliers.length > 0 && Math.random() < 0.7) {
    let nearest = multipliers.reduce((a,b) => Math.hypot(a.x-ball.x, a.y-ball.y) < Math.hypot(b.x-ball.x, b.y-ball.y) ? a : b);
    const ang = Math.atan2(nearest.y - ball.y, nearest.x - ball.x);
    ball.vx += Math.cos(ang) * (0.28 + level*0.01);
    ball.vy += Math.sin(ang) * (0.28 + level*0.01);
  } else if (Math.random() < 0.15) {
    const ang = Math.atan2(other.y - ball.y, other.x - ball.x);
    ball.vx += Math.cos(ang) * 0.2;
    ball.vy += Math.sin(ang) * 0.2;
  } else {
    ball.vx += (Math.random()-0.5)*1.2;
    ball.vy += (Math.random()-0.5)*1.2;
  }
}

function update() {
  if (gameOver || !player) return;
  const now = Date.now();
  if (now - lastTime > 1000) {
    timeLeft--; lastTime = now;
    document.getElementById('timer').textContent = timeLeft + 's';
    if (timeLeft <= 0) checkEnd();
  }

  if (!autoMode) {
    const acc = 0.45;
    if (keys['arrowleft'] || keys['a']) player.vx -= acc;
    if (keys['arrowright'] || keys['d']) player.vx += acc;
    if (keys['arrowup'] || keys['w']) player.vy -= acc;
    if (keys['arrowdown'] || keys['s']) player.vy += acc;
  } else {
    aiThink(player, ai);
  }
  aiThink(ai, player);

  [player, ai].forEach(b => {
    b.vx *= 0.97; b.vy *= 0.97;
    const spd = Math.hypot(b.vx, b.vy);
    if (spd > 9) { b.vx *= 9/spd; b.vy *= 9/spd; }
    b.x += b.vx; b.y += b.vy;
    bounceWall(b);
  });

  const dx = ai.x - player.x, dy = ai.y - player.y;
  const dist = Math.hypot(dx, dy);
  if (dist < player.r + ai.r && dist > 0) {
    const overlap = (player.r + ai.r - dist) * 0.55;
    const nx = dx/dist, ny = dy/dist;
    player.x -= nx*overlap; ai.x += nx*overlap;
    const relVx = player.vx - ai.vx, relVy = player.vy - ai.vy;
    const sep = relVx*nx + relVy*ny;
    if (sep < 0) {
      const impulse = sep * 0.75;
      player.vx -= impulse * nx; player.vy -= impulse * ny;
      ai.vx += impulse * nx; ai.vy += impulse * ny;
    }
    player.score += 6 + level; ai.score += 6 + level;
    playCollision();
    for (let i = 0; i < 8; i++) {
      particles.push({
        x: (player.x+ai.x)/2, y: (player.y+ai.y)/2,
        vx: (Math.random()-0.5)*9, vy: (Math.random()-0.5)*9,
        life: 20, color: Math.random()>0.5 ? player.color : ai.color
      });
    }
  }

  multipliers = multipliers.filter(m => {
    m.x += m.vx; m.y += m.vy;
    m.life--;
    if (m.x < 30 || m.x > W-30) m.vx *= -1;
    if (m.y < 30 || m.y > H-30) m.vy *= -1;
    [player, ai].forEach(ball => {
      if (Math.hypot(ball.x - m.x, ball.y - m.y) < ball.r + 14) {
        ball.score += m.value * (18 + level*2);
        m.life = 0;
        playPickup();
        for (let i = 0; i < 12; i++) particles.push({
          x: m.x, y: m.y, vx: (Math.random()-0.5)*11, vy: (Math.random()-0.5)*11, life: 24, color: '#ffff00'
        });
      }
    });
    return m.life > 0;
  });

  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.life--;
    p.vx *= 0.95; p.vy *= 0.95;
    return p.life > 0;
  });

  updateScore();
  if (player.score >= targetScore) completeLevel();
}

function completeLevel() {
  gameOver = true;
  playLevelUp();
  if (level >= MAX_LEVEL) {
    document.getElementById('winText').textContent = 'FULL CLEAR! 🏆';
    document.getElementById('finalMsg').textContent = `${player.name} finished all levels!`;
    document.getElementById('winScreen').style.display = 'flex';
    playWin();
  } else {
    document.getElementById('levelText').textContent = `Level ${level} Done! 🎉`;
    document.getElementById('levelMsg').textContent = `${player.name}: ${Math.round(player.score)} pts`;
    document.getElementById('levelScreen').style.display = 'flex';
  }
}
function checkEnd() {
  if (player.score >= targetScore) completeLevel();
  else {
    gameOver = true; playLose();
    document.getElementById('winText').textContent = 'Time Up';
    document.getElementById('finalMsg').textContent = `${player.name}: ${Math.round(player.score)} / ${targetScore}`;
    document.getElementById('winScreen').style.display = 'flex';
  }
}
function nextLevel() {
  if (level < MAX_LEVEL) { level++; targetScore = Math.round(targetScore * 1.5 + 30); initLevel(); }
}
function restartLevel() { initLevel(); }

function draw() {
  if (!player) return;
  ctx.fillStyle = 'rgba(10,10,18,0.32)';
  ctx.fillRect(0, 0, W, H);
  multipliers.forEach(m => {
    ctx.save();
    ctx.font = 'bold 20px Arial';
    ctx.fillStyle = '#ffff00';
    ctx.shadowBlur = 14; ctx.shadowColor = '#ffff00';
    ctx.textAlign = 'center';
    ctx.fillText(m.value + 'x', m.x, m.y + 6);
    ctx.restore();
  });
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.8, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life / 20);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  [player, ai].forEach(b => {
    ctx.save();
    ctx.shadowBlur = 22; ctx.shadowColor = b.color;
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0, '#fff');
    g.addColorStop(0.35, b.color);
    g.addColorStop(1, b.color + '00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(b.name, b.x, b.y + 4);
  });
}
function loop() { update(); draw(); requestAnimationFrame(loop); }

function resizeCanvas() {
  const [w, h] = document.getElementById('sizeSelect').value.split('x').map(Number);
  canvas.width = w; canvas.height = h; W = w; H = h;
  if (player) initLevel();
}

async function toggleRecord() {
  const btn = document.getElementById('recordBtn');
  if (!recording) {
    try {
      const stream = canvas.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      recordedChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `ball_auto_L${level}.webm`;
        a.click();
      };
      mediaRecorder.start();
      recording = true;
      btn.textContent = '⏹️ Stop & Save';
      btn.style.background = '#ffaa00';
    } catch(e) { alert('Use Chrome on Android for recording'); }
  } else {
    mediaRecorder.stop();
    recording = false;
    btn.textContent = '🔴 Record';
    btn.style.background = '#ff3333';
  }
}

canvas.addEventListener('pointerdown', e => {
  if (!player || autoMode) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  const d = Math.hypot(player.x - mx, player.y - my);
  if (d < 200) {
    player.vx += (player.x - mx)/d * 4;
    player.vy += (player.y - my)/d * 4;
  }
});

loop();
</script>
</body>
</html>
