<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Ball Battle - Full Features</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  h1 {
    margin: 6px 0;
    background: linear-gradient(90deg, #ff00ff, #00ffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 22px;
  }
  #setup, #gameArea { width: 100%; display: flex; flex-direction: column; align-items: center; }
  #setup { padding: 15px; }
  .setup-row { margin: 8px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  input, select { padding: 8px 12px; border-radius: 10px; background: #222; color: #fff; border: 1px solid #555; font-size: 14px; }
  #info {
    display: flex; gap: 10px; margin: 4px; font-size: 13px; flex-wrap: wrap; justify-content: center; text-align: center;
  }
  #levelInfo { color: #ffff00; font-weight: bold; }
  canvas {
    border: 3px solid #444; border-radius: 10px; box-shadow: 0 0 20px #ff00ff;
    background: radial-gradient(circle, #1a1a2e, #0a0a12); max-width: 100%; touch-action: none;
  }
  .controls { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button {
    padding: 8px 16px; font-size: 14px; background: linear-gradient(45deg, #ff00ff, #00ffff);
    border: none; border-radius: 18px; color: #000; font-weight: bold; cursor: pointer;
  }
  #recordBtn { background: #ff3333; color: #fff; }
  #musicBtn { background: #33aa55; color: #fff; }
  #winScreen, #levelScreen {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 20px;
  }
  #winScreen h2, #levelScreen h2 { font-size: 30px; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>⚡ Neon Ball Battle ⚡</h1>

<div id="setup">
  <div class="setup-row">
    <label>Name 1: <input id="name1" value="YOU" maxlength="12"></label>
    <label>Color 1: <input type="color" id="color1" value="#ff00ff"></label>
  </div>
  <div class="setup-row">
    <label>Name 2: <input id="name2" value="AI" maxlength="12"></label>
    <label>Color 2: <input type="color" id="color2" value="#00ffff"></label>
  </div>
  <div class="setup-row">
    <button onclick="startGame()">Start Battle</button>
  </div>
</div>

<div id="gameArea" style="display:none;">
  <div id="info">
    <div id="levelInfo">Level 1 / 10 | Target: 80</div>
    <div id="score1Display"></div>
    <div id="score2Display"></div>
    <div id="timer">Time: 45s</div>
  </div>
  <canvas id="game" width="700" height="420"></canvas>
  <div class="controls">
    <button onclick="restartLevel()">Restart</button>
    <button id="recordBtn" onclick="toggleRecord()">🔴 Record</button>
    <button id="musicBtn" onclick="toggleMusic()">🎵 Music: OFF</button>
    <select id="sizeSelect" onchange="resizeCanvas()">
      <option value="500x300">Small</option>
      <option value="700x420" selected>Medium</option>
      <option value="900x540">Large</option>
      <option value="1200x700">XL</option>
    </select>
  </div>
</div>

<div id="levelScreen">
  <h2 id="levelText">Level Complete!</h2>
  <p id="levelMsg"></p>
  <button onclick="nextLevel()">Next Level</button>
  <button onclick="restartLevel()">Retry</button>
</div>
<div id="winScreen">
  <h2 id="winText">Game Over</h2>
  <p id="finalMsg"></p>
  <button onclick="location.reload()">New Game</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width, H = canvas.height;

let player, ai, particles = [], multipliers = [];
let keys = {};
let timeLeft = 45;
let gameOver = false;
let lastTime = Date.now();
let level = 1;
const MAX_LEVEL = 10;
let targetScore = 80;
let recording = false;
let mediaRecorder = null;
let recordedChunks = [];
let musicOn = false;
let audioCtx = null;
let musicInterval = null;

function createBall(x, y, color, isPlayer, name) {
  return { x, y, vx: 0, vy: 0, r: 20, color, isPlayer, name, score: 0 };
}

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(freq, duration, type = 'sine', vol = 0.15) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + duration);
}

function playCollision() { playSound(180, 0.12, 'square', 0.12); }
function playPickup() { playSound(520, 0.15, 'sine', 0.18); playSound(780, 0.1, 'sine', 0.1); }
function playLevelUp() { playSound(440, 0.2); playSound(660, 0.2); playSound(880, 0.3); }
function playWin() { playSound(523, 0.3); playSound(659, 0.3); playSound(784, 0.5); }
function playLose() { playSound(200, 0.4, 'sawtooth', 0.15); }

function startMusic() {
  if (musicInterval) clearInterval(musicInterval);
  const notes = [261, 329, 392, 523, 392, 329];
  let i = 0;
  musicInterval = setInterval(() => {
    if (musicOn && audioCtx) playSound(notes[i % notes.length], 0.25, 'triangle', 0.06);
    i++;
  }, 400);
}

function toggleMusic() {
  initAudio();
  musicOn = !musicOn;
  document.getElementById('musicBtn').textContent = musicOn ? '🎵 Music: ON' : '🎵 Music: OFF';
  if (musicOn) startMusic();
  else if (musicInterval) clearInterval(musicInterval);
}

function startGame() {
  const n1 = document.getElementById('name1').value || 'YOU';
  const n2 = document.getElementById('name2').value || 'AI';
  const c1 = document.getElementById('color1').value;
  const c2 = document.getElementById('color2').value;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('gameArea').style.display = 'flex';
  player = createBall(W*0.25, H/2, c1, true, n1);
  ai = createBall(W*0.75, H/2, c2, false, n2);
  initLevel();
  initAudio();
}

function initLevel() {
  const scale = Math.min(W / 700, H / 420);
  player.x = W*0.25; player.y = H/2; player.vx = 0; player.vy = 0; player.r = 20 * scale; player.score = 0;
  ai.x = W*0.75; ai.y = H/2; ai.vx = 0; ai.vy = 0; ai.r = 20 * scale; ai.score = 0;
  particles = []; multipliers = [];
  timeLeft = Math.max(25, 48 - level * 2);
  gameOver = false;
  document.getElementById('levelScreen').style.display = 'none';
  document.getElementById('winScreen').style.display = 'none';
  document.getElementById('levelInfo').textContent = `Level ${level}/${MAX_LEVEL} | Target: ${targetScore}`;
  document.getElementById('timer').textContent = 'Time: ' + timeLeft + 's';
  updateScoreDisplay();
  spawnMultiplier();
  lastTime = Date.now();
}

function updateScoreDisplay() {
  document.getElementById('score1Display').innerHTML = `<span style="color:${player.color}">${player.name}: ${Math.round(player.score)}</span>`;
  document.getElementById('score2Display').innerHTML = `<span style="color:${ai.color}">${ai.name}: ${Math.round(ai.score)}</span>`;
}

function spawnMultiplier() {
  if (multipliers.length < 3 && !gameOver) {
    multipliers.push({
      x: 40 + Math.random() * (W - 80),
      y: 40 + Math.random() * (H - 80),
      value: Math.random() > 0.45 ? 2 : 3,
      life: 320
    });
  }
  if (!gameOver) setTimeout(spawnMultiplier, 2500 + Math.random() * 1200);
}

document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (gameOver || !player) return;
  const now = Date.now();
  if (now - lastTime > 1000) {
    timeLeft--; lastTime = now;
    document.getElementById('timer').textContent = 'Time: ' + timeLeft + 's';
    if (timeLeft <= 0) checkEnd();
  }

  const acc = 0.42;
  if (keys['arrowleft'] || keys['a']) player.vx -= acc;
  if (keys['arrowright'] || keys['d']) player.vx += acc;
  if (keys['arrowup'] || keys['w']) player.vy -= acc;
  if (keys['arrowdown'] || keys['s']) player.vy += acc;

  player.vx *= 0.95; player.vy *= 0.95;
  ai.vx *= 0.96; ai.vy *= 0.96;

  if (multipliers.length > 0) {
    let nearest = multipliers.reduce((a,b) => Math.hypot(a.x-ai.x,a.y-ai.y) < Math.hypot(b.x-ai.x,b.y-ai.y) ? a : b);
    const ang = Math.atan2(nearest.y - ai.y, nearest.x - ai.x);
    ai.vx += Math.cos(ang) * (0.25 + level*0.015);
    ai.vy += Math.sin(ang) * (0.25 + level*0.015);
  } else if (Math.random() < 0.04) {
    ai.vx += (Math.random()-0.5)*2; ai.vy += (Math.random()-0.5)*2;
  }

  [player, ai].forEach(b => {
    const spd = Math.hypot(b.vx, b.vy);
    if (spd > 8.5) { b.vx *= 8.5/spd; b.vy *= 8.5/spd; }
    b.x += b.vx; b.y += b.vy;
    if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx)*0.75; }
    if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx)*0.75; }
    if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy)*0.75; }
    if (b.y + b.r > H) { b.y = H - b.r; b.vy = -Math.abs(b.vy)*0.75; }
  });

  const dx = ai.x - player.x, dy = ai.y - player.y;
  const dist = Math.hypot(dx, dy);
  if (dist < player.r + ai.r && dist > 0) {
    const overlap = (player.r + ai.r - dist) / 2;
    const nx = dx/dist, ny = dy/dist;
    player.x -= nx*overlap; ai.x += nx*overlap;
    const relVx = player.vx - ai.vx, relVy = player.vy - ai.vy;
    const sep = relVx*nx + relVy*ny;
    if (sep < 0) {
      player.vx -= sep*nx*0.7; player.vy -= sep*ny*0.7;
      ai.vx += sep*nx*0.7; ai.vy += sep*ny*0.7;
    }
    player.score += 5 + level; ai.score += 4 + level;
    playCollision();
    for (let i = 0; i < 6; i++) particles.push({ x:(player.x+ai.x)/2, y:(player.y+ai.y)/2, vx:(Math.random()-0.5)*7, vy:(Math.random()-0.5)*7, life:18, color: Math.random()>0.5?player.color:ai.color });
  }

  multipliers = multipliers.filter(m => {
    m.life--;
    [player, ai].forEach(ball => {
      if (Math.hypot(ball.x - m.x, ball.y - m.y) < ball.r + 15) {
        ball.score += m.value * (15 + level*2);
        m.life = 0;
        playPickup();
        for (let i = 0; i < 10; i++) particles.push({ x:m.x, y:m.y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:22, color:'#ffff00' });
      }
    });
    return m.life > 0;
  });

  particles = particles.filter(p => { p.x+=p.vx; p.y+=p.vy; p.life--; p.vx*=0.94; p.vy*=0.94; return p.life>0; });

  updateScoreDisplay();
  if (player.score >= targetScore) completeLevel();
}

function completeLevel() {
  gameOver = true;
  playLevelUp();
  if (level >= MAX_LEVEL) {
    document.getElementById('winText').textContent = 'YOU WIN THE BATTLE! 🏆';
    document.getElementById('finalMsg').textContent = `${player.name} completed all ${MAX_LEVEL} levels!`;
    document.getElementById('winScreen').style.display = 'flex';
    playWin();
  } else {
    document.getElementById('levelText').textContent = `Level ${level} Complete! 🎉`;
    document.getElementById('levelMsg').textContent = `${player.name} reached ${Math.round(player.score)} points!`;
    document.getElementById('levelScreen').style.display = 'flex';
  }
}

function checkEnd() {
  if (player.score >= targetScore) completeLevel();
  else {
    gameOver = true;
    playLose();
    document.getElementById('winText').textContent = 'Time Up!';
    document.getElementById('finalMsg').textContent = `${player.name}: ${Math.round(player.score)} / ${targetScore}`;
    document.getElementById('winScreen').style.display = 'flex';
  }
}

function nextLevel() {
  if (level < MAX_LEVEL) {
    level++;
    targetScore = Math.round(targetScore * 1.55 + 25);
    initLevel();
  }
}

function restartLevel() { initLevel(); }

function draw() {
  if (!player) return;
  ctx.fillStyle = 'rgba(10,10,18,0.35)';
  ctx.fillRect(0, 0, W, H);
  multipliers.forEach(m => {
    ctx.save();
    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = '#ffff00';
    ctx.shadowBlur = 12; ctx.shadowColor = '#ffff00';
    ctx.textAlign = 'center';
    ctx.fillText(m.value + 'x', m.x, m.y);
    ctx.restore();
  });
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 18;
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  [player, ai].forEach(b => {
    ctx.save();
    ctx.shadowBlur = 18; ctx.shadowColor = b.color;
    const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, b.color);
    grad.addColorStop(1, b.color + '00');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(b.name, b.x, b.y + 3);
  });
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

function resizeCanvas() {
  const val = document.getElementById('sizeSelect').value;
  const [w, h] = val.split('x').map(Number);
  canvas.width = w; canvas.height = h;
  W = w; H = h;
  if (player) initLevel();
}

async function toggleRecord() {
  const btn = document.getElementById('recordBtn');
  if (!recording) {
    try {
      const stream = canvas.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      recordedChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ball_battle_L${level}.webm`;
        a.click();
        URL.revokeObjectURL(url);
      };
      mediaRecorder.start();
      recording = true;
      btn.textContent = '⏹️ Stop & Save';
      btn.style.background = '#ffaa00';
    } catch (err) {
      alert('Recording works best in Chrome (Android).');
    }
  } else {
    mediaRecorder.stop();
    recording = false;
    btn.textContent = '🔴 Record';
    btn.style.background = '#ff3333';
  }
}

canvas.addEventListener('pointerdown', (e) => {
  if (!player) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  const d = Math.hypot(player.x - mx, player.y - my);
  if (d < 180) {
    const force = 3.8;
    player.vx += (player.x - mx) / d * force;
    player.vy += (player.y - my) / d * force;
  }
});

loop();
</script>
</body>
</html>
