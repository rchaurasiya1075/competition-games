<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Ball Battle</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050510;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;touch-action:none}
  h1{margin:6px 0;background:linear-gradient(90deg,#ff00ff,#00ffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:22px}
  #setup,#gameArea{width:100%;display:flex;flex-direction:column;align-items:center}
  #setup{padding:12px}
  .row{margin:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  input,select{padding:7px 10px;border-radius:8px;background:#222;color:#fff;border:1px solid #555;font-size:13px}
  #info{display:flex;gap:8px;margin:4px;font-size:13px;flex-wrap:wrap;justify-content:center}
  #levelInfo{color:#ffff00;font-weight:bold}
  canvas{border:3px solid #444;border-radius:10px;box-shadow:0 0 25px #ff00ff;background:radial-gradient(circle,#1a1a2e,#050510);max-width:100%;touch-action:none}
  .controls{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{padding:7px 14px;font-size:13px;background:linear-gradient(45deg,#ff00ff,#00ffff);border:none;border-radius:16px;color:#000;font-weight:bold;cursor:pointer}
  #recordBtn{background:#ff3333;color:#fff}
  #musicBtn{background:#33aa55;color:#fff}
  #autoBtn{background:#aa55ff;color:#fff}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.93);flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}
  #overlay h2{font-size:28px;margin-bottom:10px}
</style>
</head>
<body>
<h1>⚡ Neon Ball Battle ⚡</h1>
<div id="setup">
  <div class="row"><label>Name 1: <input id="n1" value="Pink" maxlength="10"></label><label>Color: <input type="color" id="c1" value="#ff00ff"></label></div>
  <div class="row"><label>Name 2: <input id="n2" value="Cyan" maxlength="10"></label><label>Color: <input type="color" id="c2" value="#00ffff"></label></div>
  <div class="row"><label><input type="checkbox" id="auto" checked> Full Auto</label><button onclick="start()">Start</button></div>
</div>
<div id="gameArea" style="display:none">
  <div id="info"><div id="levelInfo">Level 1/10 | Target 80</div><div id="s1"></div><div id="s2"></div><div id="timer">45s</div></div>
  <canvas id="g" width="700" height="420"></canvas>
  <div class="controls">
    <button onclick="restart()">Restart</button>
    <button id="recordBtn" onclick="toggleRec()">🔴 Record</button>
    <button id="musicBtn" onclick="toggleMusic()">🎵 Music OFF</button>
    <button id="autoBtn" onclick="toggleAuto()">Auto: ON</button>
    <select id="size" onchange="resize()">
      <option value="500x300">Small</option><option value="700x420" selected>Medium</option>
      <option value="900x540">Large</option><option value="1200x700">XL</option>
    </select>
  </div>
</div>
<div id="overlay"><h2 id="ot"></h2><p id="om"></p><button onclick="nextOrRestart()">Continue</button><button onclick="location.reload()">New</button></div>
<script>
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
let W=cv.width,H=cv.height,p,a,parts=[],muls=[],keys={},time=45,over=false,lt=Date.now(),lv=1,MAX=10,tgt=80,rec=false,mr=null,chunks=[],mus=false,actx=null,mint=null,auto=true;
function ball(x,y,c,isP,n){return{x,y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,r:20,c,isP,n,sc:0}}
function ia(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)()}
function snd(f,d,t='sine',v=0.1){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}
function startMusic(){if(mint)clearInterval(mint);const ns=[261,329,392,523,392,329];let i=0;mint=setInterval(()=>{if(mus&&actx)snd(ns[i%ns.length],0.2,'triangle',0.05);i++},380)}
function toggleMusic(){ia();mus=!mus;document.getElementById('musicBtn').textContent=mus?'🎵 Music ON':'🎵 Music OFF';if(mus)startMusic();else if(mint)clearInterval(mint)}
function toggleAuto(){auto=!auto;document.getElementById('autoBtn').textContent=auto?'Auto: ON':'Auto: OFF'}
function start(){
  const n1=document.getElementById('n1').value||'Pink',n2=document.getElementById('n2').value||'Cyan';
  const c1=document.getElementById('c1').value,c2=document.getElementById('c2').value;
  auto=document.getElementById('auto').checked;
  document.getElementById('setup').style.display='none';
  document.getElementById('gameArea').style.display='flex';
  document.getElementById('autoBtn').textContent=auto?'Auto: ON':'Auto: OFF';
  p=ball(W*0.28,H/2,c1,true,n1);a=ball(W*0.72,H/2,c2,false,n2);
  init();ia();
}
function init(){
  const s=Math.min(W/700,H/420);
  p.x=W*0.28;p.y=H/2;p.vx=(Math.random()-0.5)*5;p.vy=(Math.random()-0.5)*5;p.r=20*s;p.sc=0;
  a.x=W*0.72;a.y=H/2;a.vx=(Math.random()-0.5)*5;a.vy=(Math.random()-0.5)*5;a.r=20*s;a.sc=0;
  parts=[];muls=[];time=Math.max(22,46-lv*2);over=false;
  document.getElementById('overlay').style.display='none';
  document.getElementById('levelInfo').textContent=`Level ${lv}/${MAX} | Target ${tgt}`;
  document.getElementById('timer').textContent=time+'s';
  upd();spawn();lt=Date.now();
}
function upd(){
  document.getElementById('s1').innerHTML=`<span style="color:${p.c}">${p.n}: ${Math.round(p.sc)}</span>`;
  document.getElementById('s2').innerHTML=`<span style="color:${a.c}">${a.n}: ${Math.round(a.sc)}</span>`;
}
function spawn(){
  if(muls.length<4&&!over)muls.push({x:50+Math.random()*(W-100),y:50+Math.random()*(H-100),vx:(Math.random()-0.5)*1.4,vy:(Math.random()-0.5)*1.4,v:Math.random()>0.5?2:3,life:300+Math.random()*80});
  if(!over)setTimeout(spawn,1600+Math.random()*900);
}
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function bounce(b){
  let hit=false;
  if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)*0.84;hit=true}
  if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)*0.84;hit=true}
  if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy)*0.84;hit=true}
  if(b.y+b.r>H){b.y=H-b.r;b.vy=-Math.abs(b.vy)*0.84;hit=true}
  if(hit){b.vx+=(Math.random()-0.5)*0.9;b.vy+=(Math.random()-0.5)*0.9;snd(110+Math.random()*50,0.05,'sine',0.04)}
}
function think(ball,oth){
  if(muls.length&&Math.random()<0.68){
    let n=muls.reduce((x,y)=>Math.hypot(x.x-ball.x,x.y-ball.y)<Math.hypot(y.x-ball.x,y.y-ball.y)?x:y);
    const ang=Math.atan2(n.y-ball.y,n.x-ball.x);
    ball.vx+=Math.cos(ang)*(0.3+lv*0.012);ball.vy+=Math.sin(ang)*(0.3+lv*0.012);
  }else if(Math.random()<0.12){
    const ang=Math.atan2(oth.y-ball.y,oth.x-ball.x);ball.vx+=Math.cos(ang)*0.22;ball.vy+=Math.sin(ang)*0.22;
  }else{ball.vx+=(Math.random()-0.5)*1.3;ball.vy+=(Math.random()-0.5)*1.3}
}
function update(){
  if(over||!p)return;
  const now=Date.now();
  if(now-lt>1000){time--;lt=now;document.getElementById('timer').textContent=time+'s';if(time<=0)end()}
  if(!auto){
    const ac=0.48;
    if(keys['arrowleft']||keys['a'])p.vx-=ac;if(keys['arrowright']||keys['d'])p.vx+=ac;
    if(keys['arrowup']||keys['w'])p.vy-=ac;if(keys['arrowdown']||keys['s'])p.vy+=ac;
  }else think(p,a);
  think(a,p);
  [p,a].forEach(b=>{
    b.vx*=0.975;b.vy*=0.975;
    const sp=Math.hypot(b.vx,b.vy);if(sp>9.2){b.vx*=9.2/sp;b.vy*=9.2/sp}
    b.x+=b.vx;b.y+=b.vy;bounce(b);
  });
  const dx=a.x-p.x,dy=a.y-p.y,dist=Math.hypot(dx,dy);
  if(dist<p.r+a.r&&dist>0){
    const ov=(p.r+a.r-dist)*0.58,nx=dx/dist,ny=dy/dist;
    p.x-=nx*ov;a.x+=nx*ov;
    const relx=p.vx-a.vx,rely=p.vy-a.vy,sep=relx*nx+rely*ny;
    if(sep<0){const imp=sep*0.78;p.vx-=imp*nx;p.vy-=imp*ny;a.vx+=imp*nx;a.vy+=imp*ny}
    p.sc+=7+lv;a.sc+=7+lv;snd(150+Math.random()*40,0.09,'square',0.09);
    for(let i=0;i<9;i++)parts.push({x:(p.x+a.x)/2,y:(p.y+a.y)/2,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:22,c:Math.random()>0.5?p.c:a.c});
  }
  muls=muls.filter(m=>{
    m.x+=m.vx;m.y+=m.vy;m.life--;
    if(m.x<30||m.x>W-30)m.vx*=-1;if(m.y<30||m.y>H-30)m.vy*=-1;
    [p,a].forEach(b=>{
      if(Math.hypot(b.x-m.x,b.y-m.y)<b.r+15){
        b.sc+=m.v*(20+lv*2);m.life=0;snd(520,0.11);snd(760,0.07);
        for(let i=0;i<12;i++)parts.push({x:m.x,y:m.y,vx:(Math.random()-0.5)*12,vy:(Math.random()-0.5)*12,life:26,c:'#ffff00'});
      }
    });
    return m.life>0;
  });
  parts=parts.filter(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.life--;pt.vx*=0.95;pt.vy*=0.95;return pt.life>0});
  upd();
  if(p.sc>=tgt)complete();
}
function complete(){
  over=true;snd(440,0.15);snd(660,0.15);snd(880,0.2);
  if(lv>=MAX){show('FULL CLEAR! 🏆',`${p.n} finished all levels!`);snd(523,0.2);snd(659,0.2);snd(784,0.35)}
  else show(`Level ${lv} Done! 🎉`,`${p.n}: ${Math.round(p.sc)} pts`);
}
function end(){
  if(p.sc>=tgt)complete();else{over=true;snd(180,0.3,'sawtooth',0.1);show('Time Up',`${p.n}: ${Math.round(p.sc)} / ${tgt}`)}
}
function show(t,m){document.getElementById('ot').textContent=t;document.getElementById('om').textContent=m;document.getElementById('overlay').style.display='flex'}
function nextOrRestart(){if(lv<MAX&&p.sc>=tgt){lv++;tgt=Math.round(tgt*1.5+30);init()}else init()}
function restart(){init()}
function draw(){
  if(!p)return;
  ctx.fillStyle='rgba(5,5,16,0.32)';ctx.fillRect(0,0,W,H);
  muls.forEach(m=>{ctx.save();ctx.font='bold 20px Arial';ctx.fillStyle='#ffff00';ctx.shadowBlur=14;ctx.shadowColor='#ffff00';ctx.textAlign='center';ctx.fillText(m.v+'x',m.x,m.y+6);ctx.restore()});
  parts.forEach(pt=>{ctx.beginPath();ctx.arc(pt.x,pt.y,2.8,0,Math.PI*2);ctx.fillStyle=pt.c;ctx.globalAlpha=Math.max(0,pt.life/22);ctx.fill();ctx.globalAlpha=1});
  [p,a].forEach(b=>{
    ctx.save();ctx.shadowBlur=22;ctx.shadowColor=b.c;
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);g.addColorStop(0,'#fff');g.addColorStop(0.35,b.c);g.addColorStop(1,b.c+'00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(b.n,b.x,b.y+4);
  });
}
function loop(){update();draw();requestAnimationFrame(loop)}
function resize(){const [w,h]=document.getElementById('size').value.split('x').map(Number);cv.width=w;cv.height=h;W=w;H=h;if(p)init()}
async function toggleRec(){
  const btn=document.getElementById('recordBtn');
  if(!rec){
    try{
      const stream=cv.captureStream(30);mr=new MediaRecorder(stream,{mimeType:'video/webm'});chunks=[];
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      mr.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ball_L${lv}.webm`;a.click()};
      mr.start();rec=true;btn.textContent='⏹️ Stop & Save';btn.style.background='#ffaa00';
    }catch(e){alert('Use Chrome on Android for recording')}
  }else{mr.stop();rec=false;btn.textContent='🔴 Record';btn.style.background='#ff3333'}
}
cv.addEventListener('pointerdown',e=>{
  if(!p||auto)return;
  const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height),d=Math.hypot(p.x-mx,p.y-my);
  if(d<200){p.vx+=(p.x-mx)/d*4.2;p.vy+=(p.y-my)/d*4.2}
});
loop();
</script>
</body>
</html>
