<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turbo Car Clash - Competition Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 {
    margin: 10px 0;
    color: #ff6b00;
    text-shadow: 0 0 10px #ff6b00;
    font-size: 28px;
  }
  #info { display: flex; gap: 50px; margin: 10px; font-size: 18px; }
  .red { color: #ff4444; }
  .blue { color: #4488ff; }
  canvas {
    border: 4px solid #444;
    border-radius: 10px;
    box-shadow: 0 0 25px #ff6b00;
    background: #111;
  }
  button {
    margin: 15px; padding: 12px 28px; font-size: 18px;
    background: #ff6b00; border: none; border-radius: 20px;
    color: #000; font-weight: bold; cursor: pointer;
  }
</style>
</head>
<body>
<h1>🏎️ Turbo Car Clash 🏎️</h1>
<div id="info">
  <div class="red">Red Car: <span id="s1">0</span> | Power: <span id="p1">1</span></div>
  <div class="blue">Blue Car: <span id="s2">0</span> | Power: <span id="p2">1</span></div>
</div>
<canvas id="c" width="800" height="500"></canvas>
<button onclick="restart()">Restart Race</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 500;

let cars = [];
let sparks = [];
let mults = [];

function makeCar(x, y, color, dir) {
  return { x, y, vx: dir * 4, vy: (Math.random()-0.5)*3, w: 70, h: 35, color, score: 0, power: 1, angle: dir > 0 ? 0 : Math.PI };
}

function init() {
  cars = [
    makeCar(150, 200, '#ff3333', 1),
    makeCar(650, 300, '#3388ff', -1)
  ];
  sparks = [];
  mults = [];
  setTimeout(spawnMult, 2000);
}

function spawnMult() {
  mults.push({
    x: 80 + Math.random()*(W-160),
    y: 80 + Math.random()*(H-160),
    v: Math.random() > 0.4 ? 2 : 3,
    t: 250
  });
  setTimeout(spawnMult, 5000);
}

function update() {
  cars.forEach(c => {
    c.x += c.vx * c.power * 0.8;
    c.y += c.vy * c.power * 0.8;
    c.angle = Math.atan2(c.vy, c.vx);

    // Walls
    if (c.x < c.w/2) { c.x = c.w/2; c.vx = Math.abs(c.vx); c.score += 2; }
    if (c.x > W - c.w/2) { c.x = W - c.w/2; c.vx = -Math.abs(c.vx); c.score += 2; }
    if (c.y < c.h/2) { c.y = c.h/2; c.vy = Math.abs(c.vy); c.score += 2; }
    if (c.y > H - c.h/2) { c.y = H - c.h/2; c.vy = -Math.abs(c.vy); c.score += 2; }

    // Slight random steer
    if (Math.random() < 0.02) c.vy += (Math.random()-0.5)*2;
  });

  // Collision
  const a = cars[0], b = cars[1];
  if (Math.abs(a.x - b.x) < (a.w+b.w)/2 && Math.abs(a.y - b.y) < (a.h+b.h)/2) {
    a.vx *= -0.8; b.vx *= -0.8;
    a.vy *= -0.7; b.vy *= -0.7;
    a.score += 8; b.score += 8;
    a.power = Math.min(a.power + 0.1, 3);
    b.power = Math.min(b.power + 0.1, 3);
    for (let i=0; i<15; i++) {
      sparks.push({ x:(a.x+b.x)/2, y:(a.y+b.y)/2, vx:(Math.random()-0.5)*12, vy:(Math.random()-0.5)*12, life:25, col: '#ffaa00' });
    }
  }

  // Mults
  mults = mults.filter(m => {
    m.t--;
    cars.forEach(c => {
      if (Math.abs(c.x-m.x)<60 && Math.abs(c.y-m.y)<40) {
        c.power = Math.min(c.power * m.v, 4);
        c.score += m.v * 15;
        m.t = 0;
        for (let i=0; i<10; i++) sparks.push({x:m.x,y:m.y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:30,col:'#ff0'});
      }
    });
    return m.t > 0;
  });

  sparks = sparks.filter(s => { s.x+=s.vx; s.y+=s.vy; s.life--; return s.life>0; });

  document.getElementById('s1').textContent = cars[0].score;
  document.getElementById('s2').textContent = cars[1].score;
  document.getElementById('p1').textContent = cars[0].power.toFixed(1);
  document.getElementById('p2').textContent = cars[1].power.toFixed(1);
}

function drawCar(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.angle);
  ctx.fillStyle = c.color;
  ctx.shadowBlur = 15;
  ctx.shadowColor = c.color;
  ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
  // Windows
  ctx.fillStyle = '#88ccff';
  ctx.fillRect(-10, -c.h/2+4, 25, c.h-8);
  // Wheels
  ctx.fillStyle = '#222';
  ctx.fillRect(-c.w/2+5, -c.h/2-4, 12, 8);
  ctx.fillRect(-c.w/2+5, c.h/2-4, 12, 8);
  ctx.fillRect(c.w/2-17, -c.h/2-4, 12, 8);
  ctx.fillRect(c.w/2-17, c.h/2-4, 12, 8);
  ctx.restore();
}

function draw() {
  ctx.fillStyle = 'rgba(13,17,23,0.3)';
  ctx.fillRect(0,0,W,H);

  // Road lines
  ctx.strokeStyle = '#444';
  ctx.setLineDash([20,20]);
  ctx.beginPath();
  ctx.moveTo(0, H/2);
  ctx.lineTo(W, H/2);
  ctx.stroke();
  ctx.setLineDash([]);

  mults.forEach(m => {
    ctx.font = 'bold 26px Arial';
    ctx.fillStyle = '#ffdd00';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ff0';
    ctx.textAlign = 'center';
    ctx.fillText(m.v+'x', m.x, m.y);
  });

  sparks.forEach(s => {
    ctx.fillStyle = s.col;
    ctx.globalAlpha = s.life/25;
    ctx.fillRect(s.x, s.y, 4, 4);
    ctx.globalAlpha = 1;
  });

  cars.forEach(drawCar);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

function restart() { init(); }

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX-rect.left)*(W/rect.width);
  const my = (e.clientY-rect.top)*(H/rect.height);
  cars.forEach(c => {
    if (Math.hypot(c.x-mx, c.y-my) < 100) {
      c.vx += (c.x - mx) * 0.05;
      c.vy += (c.y - my) * 0.05;
    }
  });
});

init();
loop();
</script>
</body>
</html>
