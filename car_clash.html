<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Turbo Car Clash</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{margin:8px;background:linear-gradient(90deg,#ff5500,#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
canvas{border:3px solid #333;border-radius:10px;box-shadow:0 0 20px #ff5500;background:#111;max-width:100%}
.controls{margin:8px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{padding:8px 14px;background:#ff5500;color:#000;border:none;border-radius:20px;font-weight:bold}
#info{display:flex;gap:15px;margin:6px;font-size:15px}
</style>
</head>
<body>
<h1>🏎️ Turbo Car Clash</h1>
<div id="info"><span id="you">YOU: 0</span><span id="ai">AI: 0</span><span id="time">Time: 50s</span></div>
<canvas id="c" width="800" height="480"></canvas>
<div class="controls"><button onclick="restart()">Restart</button><span>Arrow / WASD to drive | Collect 2x/3x</span></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=cv.width,H=cv.height,you,ai,items=[],parts=[],time=50,over=false,last=Date.now();
function car(x,y,col,isYou){return{x,y,vx:0,vy:0,angle:0,col,isYou,score:0,power:100}}
function init(){
  you=car(200,240,'#ff5500',true); ai=car(600,240,'#00aaff',false);
  items=[];parts=[];time=50;over=false;spawn();last=Date.now();
}
function spawn(){if(items.length<3&&!over)items.push({x:50+Math.random()*(W-100),y:50+Math.random()*(H-100),v:Math.random()>.5?2:3,l:200});if(!over)setTimeout(spawn,2000)}
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const keys={};
function update(){
  if(over)return;
  if(Date.now()-last>1000){time--;last=Date.now();document.getElementById('time').textContent='Time: '+time+'s';if(time<=0)end()}
  if(keys.arrowup||keys.w){you.vx+=Math.cos(you.angle)*.4;you.vy+=Math.sin(you.angle)*.4}
  if(keys.arrowdown||keys.s){you.vx-=Math.cos(you.angle)*.2;you.vy-=Math.sin(you.angle)*.2}
  if(keys.arrowleft||keys.a)you.angle-=.08;
  if(keys.arrowright||keys.d)you.angle+=.08;
  you.vx*=.96;you.vy*=.96;
  if(items.length){let n=items[0],ang=Math.atan2(n.y-ai.y,n.x-ai.x);ai.angle=ang;ai.vx+=Math.cos(ang)*.3;ai.vy+=Math.sin(ang)*.3}
  ai.vx*=.97;ai.vy*=.97;
  [you,ai].forEach(c=>{c.x+=c.vx;c.y+=c.vy;if(c.x<30||c.x>W-30)c.vx*=-1;if(c.y<30||c.y>H-30)c.vy*=-1});
  let d=Math.hypot(you.x-ai.x,you.y-ai.y);
  if(d<40){you.score+=5;ai.score+=5;you.power=Math.max(20,you.power-10);ai.power=Math.max(20,ai.power-10);
    let nx=(you.x-ai.x)/d,ny=(you.y-ai.y)/d;you.vx+=nx*3;you.vy+=ny*3;ai.vx-=nx*3;ai.vy-=ny*3;
    for(let i=0;i<6;i++)parts.push({x:(you.x+ai.x)/2,y:(you.y+ai.y)/2,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:15});
  }
  items=items.filter(it=>{it.l--;[you,ai].forEach(c=>{if(Math.hypot(c.x-it.x,c.y-it.y)<30){c.score+=it.v*20;c.power=Math.min(100,c.power+15);it.l=0}});return it.l>0});
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.l--;return p.l>0});
  document.getElementById('you').textContent='YOU: '+Math.round(you.score);
  document.getElementById('ai').textContent='AI: '+Math.round(ai.score);
}
function end(){over=true;alert(you.score>ai.score?'YOU WIN!':'AI Wins or Draw')}
function draw(){
  ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
  items.forEach(it=>{ctx.fillStyle='#ff0';ctx.font='bold 18px Arial';ctx.fillText(it.v+'x',it.x,it.y)});
  parts.forEach(p=>{ctx.fillStyle='#fa0';ctx.fillRect(p.x,p.y,4,4)});
  [you,ai].forEach(c=>{
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);
    ctx.fillStyle=c.col;ctx.fillRect(-18,-10,36,20);
    ctx.fillStyle='#fff';ctx.fillRect(8,-6,8,12);
    ctx.restore();
  });
}
function loop(){update();draw();requestAnimationFrame(loop)}
function restart(){init()}
init();loop();
</script>
</body>
</html>
